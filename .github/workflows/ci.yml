name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Skip release-please PRs: their head branch pushes/merges race with in-flight
    # runs (observed failures on the 1.2.0/1.3.0 release PRs) and the result gates
    # nothing -- merging to master triggers the full suite via the push event.
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'release-please') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
