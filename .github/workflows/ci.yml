name: ci

on:
  push:
    branches: [master]
  pull_request:
    # Never trigger on release-please branches at all: their PR runs are
    # bot-created (they sit in approval/limbo states and die as phantom
    # "workflow file issue" failures if the PR merges while the run is
    # still initializing), and merging to master triggers the full suite
    # via the push event anyway.
    branches-ignore:
      - "release-please--**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
