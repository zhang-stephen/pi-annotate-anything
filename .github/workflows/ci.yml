name: ci

# CI runs only on pushes to master. Deliberately no pull_request trigger:
# workflows that declare one materialize phantom zero-job "failure" runs on
# the release-please branch when the PR merges while a run initializes, even
# behind branches-ignore (verified across four releases). Local gates cover
# pre-merge verification; the push run is the real coverage.
on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
